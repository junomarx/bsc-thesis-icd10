# Selenium infrastructure for TEST-E2E-01/02, kept separate from
# prototype_stack/compose.yaml deliberately: Selenium is test tooling, not
# part of the deployed learner-facing stack, so it must never start as a
# side effect of `stack.sh up`.
#
# Usage (from this directory), against a stack already started via
# prototype_stack/stack.sh or docker compose (see app/tests/E2E/README.md):
#
#   docker compose up -d
#   cd ../../.. && ICD_E2E_BASE_URL=http://127.0.0.1:5860 \
#     php app/vendor/bin/phpunit -c app/phpunit.xml --testsuite e2e
#   docker compose down

services:
  selenium:
    # selenium/standalone-chrome has no official linux/arm64 build (Chrome
    # for Testing isn't built for arm64 Linux); seleniarm/standalone-chromium
    # is the community arm64 equivalent (Chromium instead of Chrome - same
    # WebDriver protocol, irrelevant to what these tests assert). Default is
    # the arm64 image (this project's development host is Apple Silicon);
    # CI (GitHub-hosted ubuntu-latest runners, amd64) overrides
    # SELENIUM_IMAGE to the official selenium/standalone-chrome image — see
    # .github/workflows/ci.yml. Both pinned to a manifest-list digest as of
    # the PROTOBASE-1.0 development freeze (docs/environment_manifest_0_1.json);
    # the `develop` branch's copy of this file keeps floating tags.
    image: ${SELENIUM_IMAGE:-seleniarm/standalone-chromium@sha256:d644a5f679e83e63344cee11c08fc2c7bf4acf43217434a8621a2bc85f7473a5}
    shm_size: 2gb
    ports:
      - "4444:4444" # WebDriver endpoint
      - "7900:7900" # noVNC, for watching the browser live if useful
    extra_hosts:
      # Lets the browser reach the app's published host port as
      # host.docker.internal:5860 regardless of how the app was started
      # (prototype_stack Compose or a bare `php -S`) or which OS this runs
      # on (Docker Desktop provides this automatically; host-gateway makes
      # it work on Linux too, Docker Engine >= 20.10).
      - "host.docker.internal:host-gateway"
