name: icd-learning-prototype

services:
  db:
    # Pinned to a manifest-list digest as of the PROTOBASE-1.0 development
    # freeze (docs/environment_manifest_0_1.json; resolved to MySQL
    # 26.7.0). Was deliberately unpinned below the major version during
    # development - MySQL's exact minor/patch was never a criterion the
    # prototype depended on (only CHECK constraint support, i.e. MySQL >=
    # 8.0.16, actually matters) - because REQ-CFG-01 only requires pinning
    # the execution environment once, at the eventual evaluation freeze.
    # This is that pin. Ongoing development against a floating tag
    # continues on the `develop` branch's copy of this file, not here.
    image: mysql@sha256:66aec17cd21a956029b83f083b813073859e8355dc1a00e55df6ba02f0e32345
    environment:
      MYSQL_DATABASE: ${ICD_DB_NAME:?ICD_DB_NAME is required}
      MYSQL_USER: ${ICD_DB_USER:?ICD_DB_USER is required}
      MYSQL_PASSWORD: ${ICD_DB_PASSWORD:?ICD_DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${ICD_DB_ROOT_PASSWORD:?ICD_DB_ROOT_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  bootstrap:
    build:
      context: ../prototype_baseline
      dockerfile: Dockerfile.bootstrap
    environment:
      ICD_DB_HOST: db
      ICD_DB_PORT: "3306"
      ICD_DB_NAME: ${ICD_DB_NAME:?ICD_DB_NAME is required}
      ICD_DB_USER: ${ICD_DB_USER:?ICD_DB_USER is required}
      ICD_DB_PASSWORD: ${ICD_DB_PASSWORD:?ICD_DB_PASSWORD is required}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: ${APP_SOURCE_DIR:-.runtime/app}
      dockerfile: Dockerfile
      target: runtime
    environment:
      ICD_DB_HOST: db
      ICD_DB_PORT: "3306"
      ICD_DB_NAME: ${ICD_DB_NAME:?ICD_DB_NAME is required}
      ICD_DB_USER: ${ICD_DB_USER:?ICD_DB_USER is required}
      ICD_DB_PASSWORD: ${ICD_DB_PASSWORD:?ICD_DB_PASSWORD is required}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_HTTP_PORT:-5860}:80"
    restart: unless-stopped

volumes:
  mysql_data:
